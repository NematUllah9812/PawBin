<script>
(function(){
  var C=['assets/img/','pawbin/assets/img/','/pawbin/assets/img/'];
  document.addEventListener('error',function(e){
    var t=e.target;
    if(!t||t.tagName!=='IMG'||!t.dataset.f)return;
    var n=+(t.dataset.i||0)+1;
    if(n<C.length){t.dataset.i=n;t.src=C[n]+t.dataset.f;}
  },true);
})();
</script>
